    <!-- Flash prevention: set data-ui and data-mode before any paint -->
    <script>
      (function () {
        var theme = localStorage.getItem('fp-theme') || 'digital';
        var mode = localStorage.getItem('fp-mode') || 'dark';
        document.documentElement.setAttribute('data-ui', theme);
        document.documentElement.setAttribute('data-mode', mode);
      })();
    </script>

    <!-- model-viewer for CAD .glb files -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <!-- Plausible analytics — account must be created at plausible.io with freshprints.dev as a site -->
    <script defer data-domain="freshprints.dev" src="https://plausible.io/js/script.js"></script>

    <!-- Skip to content for accessibility -->
    <style>
      .skip-to-content {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-to-content:focus {
        position: fixed;
        top: 1rem;
        left: 1rem;
        width: auto;
        height: auto;
        padding: 0.75rem 1.5rem;
        background: #00C8FF;
        color: #0A0A0F;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 4px;
        z-index: 9999;
        overflow: visible;
      }
    </style>
  </head>
