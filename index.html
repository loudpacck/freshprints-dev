    <!-- Flash prevention: resolve theme + mode before any paint -->
    <script>
      (function () {
        var theme = localStorage.getItem('fp-theme') || 'standard';
        document.documentElement.setAttribute('data-ui', theme);
        if (theme === 'retro') {
          var crt = localStorage.getItem('fp-retro-crt') || 'on';
          document.documentElement.setAttribute('data-crt', crt);
        } else {
          var modePref = localStorage.getItem('fp-mode') || 'auto';
          var mode = (modePref === 'auto' || !modePref)
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : modePref;
          document.documentElement.setAttribute('data-mode', mode);
        }
      })();
    </script>

    <!-- model-viewer for CAD .glb files -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <!-- Plausible analytics — account must be created at plausible.io with freshprints.dev as a site -->

    <!-- Skip to content for accessibility -->

        text-decoration: none;
